<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1a1a1a; }
      .text-primary { fill: #f5f5f5; font-family: -apple-system, system-ui, BlinkMacSystemFont, sans-serif; }
      .text-secondary { fill: #e8e8e8; font-family: -apple-system, system-ui, BlinkMacSystemFont, sans-serif; }
      .accent { fill: rgba(255, 255, 255, 0.08); }
      .border { stroke: rgba(255, 255, 255, 0.12); stroke-width: 1; fill: none; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="630"/>
  
  <!-- Accent elements -->
  <rect class="accent" x="80" y="80" width="280" height="280" rx="12"/>
  <rect class="border" x="80" y="80" width="280" height="280" rx="12"/>
  
  <!-- Initials in box -->
  <text class="text-primary" x="220" y="260" font-size="120" font-weight="600" text-anchor="middle">DV</text>
  
  <!-- Name -->
  <text class="text-primary" x="420" y="220" font-size="64" font-weight="600">Daniel Vafidis</text>
  
  <!-- Title -->
  <text class="text-secondary" x="420" y="280" font-size="32" font-weight="400" opacity="0.8">Product Engineer &amp; Creative Technologist</text>
  
  <!-- Tagline -->
  <text class="text-secondary" x="420" y="340" font-size="24" font-weight="400" opacity="0.6">Building exceptional digital experiences</text>
  
  <!-- Tech stack badges -->
  <g transform="translate(420, 400)">
    <rect class="accent" x="0" y="0" width="100" height="40" rx="6"/>
    <rect class="border" x="0" y="0" width="100" height="40" rx="6"/>
    <text class="text-secondary" x="50" y="26" font-size="16" font-weight="500" text-anchor="middle" opacity="0.8">React</text>
    
    <rect class="accent" x="120" y="0" width="130" height="40" rx="6"/>
    <rect class="border" x="120" y="0" width="130" height="40" rx="6"/>
    <text class="text-secondary" x="185" y="26" font-size="16" font-weight="500" text-anchor="middle" opacity="0.8">TypeScript</text>
    
    <rect class="accent" x="270" y="0" width="140" height="40" rx="6"/>
    <rect class="border" x="270" y="0" width="140" height="40" rx="6"/>
    <text class="text-secondary" x="340" y="26" font-size="16" font-weight="500" text-anchor="middle" opacity="0.8">JavaScript</text>
  </g>
</svg>
